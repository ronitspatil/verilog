name: CI

# Docs-only changes (every changed file matches paths-ignore) start no jobs:
# nothing here checks prose, and no code, test or script reads these paths.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "deployments/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "deployments/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.7.1
  PYTHON_VERSION: "3.12"
  # protoc that produced the committed stubs (see daemon/gen headers).
  PROTOC_VERSION: 3.20.3
  PROTOC_SHA256: 44a6b498e996b845edef83864734c0e52f42197e85c9d567af55f4e3ff09d755
  GOVULNCHECK_VERSION: v1.8.0
  PIP_AUDIT_VERSION: 2.10.1

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck (allowlist in .github/govulncheck-allow.txt)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck" ../scripts/govulncheck.sh

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build
      - run: forge test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt
      - name: venv from the hashed lock
        run: make venv PYTHON=python
      - run: sdk/python/.venv/bin/pytest -q sdk/python
      - name: pip-audit
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q "pip-audit==$PIP_AUDIT_VERSION"
          /tmp/audit/bin/pip-audit --require-hashes --disable-pip -r sdk/python/requirements-dev.txt

  reproducible:
    name: generated code is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
          unzip -q /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
      - run: make tools venv PYTHON=python
      - run: make proto bindings vectors
      - name: committed generated code matches its sources
        run: |
          git status --short
          git diff --exit-code

  # e2e is the most expensive job and runs on pull requests only. main moves
  # only through PRs, and a pull_request run already tests the PR merged into
  # its base (refs/pull/N/merge), so re-running it on the push to main mostly
  # spends the same minutes on the same tree. The cheaper jobs still run on
  # main and catch a base that moved after the PR's last run.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: make venv PYTHON=python
      - name: make e2e
        env:
          KEEP_WORK: "1"
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          # A hang fails the step (and uploads the logs) instead of
          # running into the job timeout, which cancels without logs.
          timeout -k 10 900 ./scripts/e2e.sh 2>&1 | tee "$TMPDIR/e2e-output.log"
      - name: upload e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e
          retention-days: 7
