# Prometheus alerting rules for verilogd (served with --metrics-listen).
# Each alert has an entry in docs/runbook.md#alerts. The rules assume the
# scrape job is named "verilog"; change the `up` selector if yours differs.
#
# Check: promtool check rules deploy/prometheus/alerts.yml
#        promtool test rules deploy/prometheus/alerts_test.yml
groups:
  - name: verilog
    rules:
      - alert: VeriLogDown
        expr: up{job="verilog"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: verilogd {{ $labels.instance }} is down or not scraped
          runbook: docs/runbook.md#verilogdown

      - alert: VeriLogAnchorQueueGrowing
        # Sealed epochs pile up faster than they are anchored and final.
        expr: verilog_anchor_queue_epochs > 10 and deriv(verilog_anchor_queue_epochs[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "anchor queue at {{ $value }} epochs and growing on {{ $labels.instance }}"
          runbook: docs/runbook.md#veriloganchorqueuegrowing

      - alert: VeriLogAnchorQueueStuck
        # Epochs are queued but none became final for an hour (Base: ~20 min
        # from mining to finalized); also fires 30 min after a restart if none has.
        expr: verilog_anchor_queue_epochs > 0 and increase(verilog_epochs_anchored_total[30m]) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} epochs queued, none anchored for an hour on {{ $labels.instance }}"
          runbook: docs/runbook.md#veriloganchorqueuestuck

      - alert: VeriLogFinalityLagHigh
        # Base Sepolia reached `finalized` ~19 min after mining; 45 min is well past normal.
        expr: verilog_finality_lag_seconds > 2700
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "oldest mined anchor not final for {{ $value | humanizeDuration }} on {{ $labels.instance }}"
          runbook: docs/runbook.md#verilogfinalitylaghigh

      - alert: VeriLogEpochsNotAnchored
        # Events are accepted but no epoch became final for an hour.
        expr: increase(verilog_events_accepted_total[30m]) > 0 and increase(verilog_epochs_anchored_total[30m]) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: events accepted but no epoch anchored for an hour on {{ $labels.instance }}
          runbook: docs/runbook.md#verilogepochsnotanchored

      - alert: VeriLogBackpressure
        expr: sum by (instance, reason) (rate(verilog_backpressure_rejections_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "events refused for {{ $labels.reason }} on {{ $labels.instance }}"
          runbook: docs/runbook.md#verilogbackpressure

      - alert: VeriLogDiskLow
        # Below --min-free-disk-bytes: ingest is refused.
        expr: verilog_disk_low == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: data dir disk below --min-free-disk-bytes on {{ $labels.instance }}; ingest refused
          runbook: docs/runbook.md#verilogdisklow

      - alert: VeriLogDiskFreeLow
        expr: verilog_disk_free_bytes / verilog_disk_total_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "data dir disk {{ $value | humanizePercentage }} free on {{ $labels.instance }}"
          runbook: docs/runbook.md#verilogdisklow

      - alert: VeriLogSignerBalanceLow
        # 0.01 ETH: about a week of anchoring every 30 s at the observed Base
        # Sepolia cost (~4.7e11 wei per anchor: 77k gas at 0.006 gwei plus the
        # L1 fee). Re-derive from your chain's cost and epoch rate.
        expr: verilog_signer_balance_wei < 1e16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "anchoring key {{ $labels.address }} holds {{ $value }} wei"
          runbook: docs/runbook.md#verilogsignerbalancelow

      - alert: VeriLogTLSCertExpiring
        expr: verilog_tls_cert_expiry_timestamp_seconds - time() < 14 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "server TLS certificate expires in {{ $value | humanizeDuration }} on {{ $labels.instance }}"
          runbook: docs/runbook.md#verilogtlscertexpiring
