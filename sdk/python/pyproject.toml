[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-sdk"
version = "0.1.0"
description = "VeriLog client SDK: tamper-evident audit logging for LangChain/LangGraph agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8", "grpcio-tools>=1.84.0", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
include = ["verilog_sdk*"]

[tool.setuptools.package-data]
verilog_sdk = ["py.typed", "_proto/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
