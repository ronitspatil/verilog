name: contract library releases

# Fails (non-required, scheduled) when OpenZeppelin Contracts or forge-std has
# a newer release than the commit the submodule pins. Bump by hand following
# "Upgrading the contract libraries" in docs/operations.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: compare pinned submodules with the latest release tags
        run: |
          stale=0
          for spec in OpenZeppelin/openzeppelin-contracts foundry-rs/forge-std; do
            path="contracts/lib/${spec#*/}"
            pinned="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_SHA" -q .sha)"
            tag="$(gh api "repos/$spec/releases/latest" -q .tag_name)"
            # Last line is the peeled commit for annotated tags.
            latest="$(git ls-remote "https://github.com/$spec" "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)"
            if [ "$pinned" = "$latest" ]; then echo "$path is at $tag"; continue; fi
            echo "::warning::$path pins $pinned; latest release $tag is $latest"
            stale=1
          done
          exit "$stale"
